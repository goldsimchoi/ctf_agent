interface:
  display_name: "Pwn Agent"
  short_description: "Solve authorized CTF pwnables and verify flags"
  default_prompt: "Use $pwn-agent to solve this authorized pwn challenge and return a verified flag."
dependencies:
  tools:
    - type: "mcp"
      value: "gdb"
      description: "Stateful local GDB debugging"
      transport: "stdio"
    - type: "mcp"
      value: "idalib"
      description: "Local IDA library analysis"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
